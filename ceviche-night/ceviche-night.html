/* Layout: one screen, a flex column (clock bar, alerts, timers, scrolling page, action bar, tab bar).

:root {

  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, "Helvetica Neue", sans-serif;

  /* Fiesta palette: teal, pink and orange on black, white and silver */
  --f-teal: #00B2A9;

  --bg: #F3F5F6;

  --bar: #FFFFFF;
  --sheet-bg: #F3F5F6;
  --sheet-card: #FFFFFF;
  --sheet-fill: #E4E8EB;
  --line: #D2D8DC;
  --scrim: rgba(0, 0, 0, 0.45);

  /* text */
  --fg: #0B0B0C;
  --fg-2: #4E555B;
  --link: #00726C;
  --focus: #00726C;

  /* neutral controls */
  --btn: #FFFFFF;
  --btn-press: #E4E8EB;
  --btn-line: #C4CED4;
  --fill: #E8ECEE;
  --fill-press: #D7DDE1;

  /* go: teal */
  --go: #00B2A9;
  --go-press: #009A92;
  --go-fg: #00110F;
  --ok-text: #00625C;
  --ok-tint: #D3F3F0;

  /* time: orange. alert: pink */
  --late-text: #7E3D00;
  --late-tint: #FFE4C7;
  --time-text: #864100;
  --time-tint: #FFE7CF;
  --time-solid: #FF8200;
  --time-on: #1F0E00;
  --alert: #EF426F;
  --alert-fg: #1C0009;
  --alert-btn: #FFFFFF;
  --alert-btn-press: #FBD3DD;
  --alert-btn-fg: #9A0C40;
  --alert-text: #8E0B3A;
  --alert-tint: #FDE4EA;

  /* preview */
  --preview: #0B0B0C;
  --preview-fg: #FFFFFF;
  --preview-btn: #FFFFFF;
  --preview-btn-press: #E4E8EB;
  --preview-btn-fg: #0B0B0C;

  /* one colour per dish (fills; text on them is --d-on, or --d-on-2 for the last four) */
  --d-scoop: #00B2A9;
  --d-pink: #EF426F;
  --d-patron: #FF8200;
  --d-milky: #9FACB5;
  --d-blanch: #B5134B;
  --d-cream: #007F7A;
  --d-elote: #B35400;
  --d-day: #111315;
  --d-on: #0B0B0C;
  --d-on-2: #FFFFFF;
  --dish: var(--d-day);
}

    --ok-text: #4FD8D0;
    --ok-tint: #062B29;
    --late-text: #FFB866;
    --late-tint: #3A1F00;
    --time-text: #FFA64D;
    --time-tint: #3A1F00;
    --time-solid: #FF8200;

    --alert: #EF426F;
    --alert-fg: #1C0009;
    --alert-btn: #1C0009;
    --alert-btn-press: #3A0A1A;
    --alert-btn-fg: #FFB3C6;

    --preview-fg: #0B0B0C;

    --preview-btn-press: #26282B;
    --preview-btn-fg: #FFFFFF;
    --d-scoop: #00B2A9;
    --d-pink: #EF426F;
    --d-patron: #FF8200;

    color-scheme: dark;
  }
}

  --f-teal: #00B2A9;
  --f-pink: #EF426F;

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html {
  height: 100%;
  /* top half and bottom half continue the clock bar and the tab bar into the phone's safe areas */
  background: linear-gradient(to bottom, var(--bg) 0, var(--bg) 50%, var(--bar) 50%, var(--bar) 100%);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font: 400 21px/1.4 var(--font);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button, a, input { font: inherit; color: inherit; }
button {
  -webkit-appearance: none; appearance: none;
  border: 0; margin: 0; padding: 0; background: none; cursor: pointer; text-align: inherit;
}
a { text-decoration: none; }
button, a, input, [role="button"] { touch-action: manipulation; }
[data-act] { cursor: pointer; }               /* iOS only sends taps on non-button elements that look clickable */
button, a, [role="button"] { -webkit-user-select: none; user-select: none; }
svg { display: block; flex: none; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.c-scoop { --dish: var(--d-scoop); }
.c-pink { --dish: var(--d-pink); }
.c-patron { --dish: var(--d-patron); }
.c-milky { --dish: var(--d-milky); }
.c-blanch { --dish: var(--d-blanch); --dish-on: var(--d-on-2); }
.c-cream { --dish: var(--d-cream); --dish-on: var(--d-on-2); }
.c-elote { --dish: var(--d-elote); --dish-on: var(--d-on-2); }
.c-day { --dish: var(--d-day); --dish-on: var(--d-on-2); }

/* the Fiesta stripe: teal, pink, orange */
.app::before { content: ""; flex: none; height: 6px; background: linear-gradient(90deg, var(--f-teal) 0 33.34%, var(--f-pink) 33.34% 66.67%, var(--f-orange) 66.67% 100%); }
#board-root .bd { border-top: 6px solid var(--f-teal); border-image: linear-gradient(90deg, var(--f-teal) 0 33.34%, var(--f-pink) 33.34% 66.67%, var(--f-orange) 66.67% 100%) 1; }
.app {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  touch-action: manipulation;                 /* no double-tap zoom anywhere: a second tap is just a second tap */
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  width: 100%;
  max-width: 640px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
/* every vertical stack is one column that can shrink: long words wrap instead of widening the page */
.step, .body, .block, .hero, .ticks, .tn, .rows, .setup, .sect, .card, .dish, .stack, .group, .day-head, .help, .gloss,
.actions-in, .sheet-actions-in, .banners-in, .warn-list, .meta, .kv { grid-template-columns: minmax(0, 1fr); }

/* ---------- clock bar ---------- */
.status { display: block; flex: none; color: var(--fg); }
.status-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; }
.clock { font: 700 31px/1 var(--font-round); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; white-space: nowrap; transition: color 0.3s; }
.status.alerting .clock { color: var(--alert-text); }
.clock small { font-size: 18px; font-weight: 700; margin-left: 4px; color: var(--fg-2); }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 42px; padding: 6px 10px 6px 14px; border-radius: 21px;
  background: var(--ok-tint); color: var(--ok-text);
  font: 600 17px/1.15 var(--font); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.pill.late { background: var(--late-tint); color: var(--late-text); }
.pill.plain { background: var(--fill); color: var(--fg); }
.status:active .pill { opacity: 0.6; }

/* ---------- banners: preview and alerts ---------- */
.banners { flex: none; }
.banners-in { display: grid; gap: 8px; padding-block: 4px 8px; }
.banner {
  display: flex; align-items: center; gap: 12px;
  min-height: 80px; padding: 8px 8px 8px 16px; border-radius: 20px;
  background: var(--alert); color: var(--alert-fg);
}
.banner-text { flex: 1; min-width: 0; font: 700 21px/1.2 var(--font); text-wrap: balance; }
.banner-text small { display: block; font: 600 17px/1.25 var(--font); }
.banner .btn {
  flex: none; min-width: 104px; box-shadow: none;
  background: var(--alert-btn); color: var(--alert-btn-fg); font-size: 21px; font-weight: 700;
}
.banner .btn:active { background: var(--alert-btn-press); }
.banner.preview { background: var(--preview); color: var(--preview-fg); min-height: 80px; }
.banner.preview .banner-text { font-size: 19px; letter-spacing: 0.01em; }
.banner.preview .btn { background: var(--preview-btn); color: var(--preview-btn-fg); }
.banner.preview .btn:active { background: var(--preview-btn-press); }
.banner.soon { background: var(--late-tint); color: var(--late-text); padding: 8px 16px; min-height: 64px; }

/* ---------- running timers ---------- */
.chips { flex: none; overflow-x: auto; overflow-y: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips-in {
  display: flex; gap: 12px; width: max-content; min-width: 100%; max-width: none; padding-block: 12px 4px;
  /* on a wide screen the strip starts where the 640px column starts */
  padding-left: max(16px, env(safe-area-inset-left, 0px), calc(50vw - 304px));
  padding-right: max(16px, env(safe-area-inset-right, 0px), calc(50vw - 304px));
}
.chip {
  display: inline-flex; align-items: center; gap: 8px; flex: none;
  min-height: 46px; padding: 6px 14px 6px 12px; border-radius: 23px;
  background: var(--time-tint); color: var(--time-text);
  font: 600 17px/1 var(--font); white-space: nowrap;
}
.chip b { font: 700 20px/1 var(--font-round); font-variant-numeric: tabular-nums; }
.chip.ready { background: var(--alert-tint); color: var(--alert-text); }
.chip:active { opacity: 0.6; }
.chips-in { width: auto; } .chip { flex: 1 1 0; min-width: 0; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; padding: 8px 12px; border-radius: 16px; min-height: 60px; } .chip > span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; } .chip svg { display: none; }

/* ---------- the scrolling page ---------- */
.page-wrap { flex: 1 1 auto; min-height: 0; position: relative; display: flex; }
/* 12px dead strips at both edges of the scrolling page: a row sliding under a bar can never be hit by a finger aimed at the bar */
.page-wrap::before, .page-wrap::after { content: ""; position: absolute; left: 0; right: 0; height: 12px; z-index: 3; }
.page-wrap::before { top: 0; }
.page-wrap.scrolled::before { background: linear-gradient(to bottom, var(--bg), var(--bg-0)); }
.page-wrap::after { bottom: 0; }
.page { flex: 1; min-width: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.view { padding-block: 12px 28px; }
.more-hint {
  position: absolute; left: 0; right: 0; bottom: 0; height: 36px; z-index: 2; pointer-events: none;
  background: linear-gradient(to bottom, var(--bg-0), var(--bg));
  opacity: 0; transition: opacity 0.15s;
}
.page-wrap.more .more-hint { opacity: 1; }
.enter { animation: enter 0.18s ease-out; }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- step card ---------- */
.step { display: grid; gap: 18px; }
.crumb { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 2px 10px; font: 600 17px/1.25 var(--font); color: var(--fg-2); }
.crumb .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--dish); }
.crumb .nick { color: var(--fg); color: color-mix(in srgb, var(--dish) 50%, var(--fg)); font-weight: 700; }
.crumb .where { white-space: nowrap; }
.crumb .plain { grid-column: 2 / -1; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.title { font: 700 clamp(32px, 8.7vw, 38px)/1.1 var(--font); letter-spacing: -0.022em; text-wrap: balance; }
.note-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px;
  background: var(--fill); color: var(--fg); font: 600 18px/1.25 var(--font);
}
.note-row.time { background: var(--time-tint); color: var(--time-text); }
.note-row.ok { background: var(--ok-tint); color: var(--ok-text); }
.body { display: grid; gap: 13px; }
.body p { font-size: clamp(21px, 5.65vw, 23px); line-height: 1.38; }
.term {
  display: inline; padding: 12px 1px; margin: 0; border-radius: 6px;
  color: var(--link); font-weight: 500;
  -webkit-text-decoration-line: underline; text-decoration-line: underline;
  -webkit-text-decoration-style: dotted; text-decoration-style: dotted;
  text-decoration-thickness: 2px; text-underline-offset: 5px;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.term:active { opacity: 0.55; }
.block { display: grid; gap: 8px; }
.block.tight { gap: 2px; }
.label { font: 600 17px/1.2 var(--font); color: var(--fg-2); }
.need-list { display: flex; flex-wrap: wrap; gap: 8px; }
.need-list li { background: var(--card); border-radius: 12px; padding: 8px 12px; font: 500 19px/1.2 var(--font); }
.callout { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 16px; background: var(--card); }
.callout svg { margin-top: 1px; color: var(--fg-2); }
.callout .label { display: block; margin-bottom: 3px; }
.callout .val { font-size: clamp(21px, 5.65vw, 23px); line-height: 1.32; }
.callout.into { background: var(--card); background: color-mix(in srgb, var(--dish) 13%, var(--card)); }
.callout.into svg { color: var(--fg); color: color-mix(in srgb, var(--dish) 50%, var(--fg)); }
.callout.into .val { font-weight: 700; }
.callout.look svg { color: var(--ok-text); }
.callout.warn { background: var(--alert-tint); color: var(--alert-text); }
.callout.warn svg { color: var(--alert-text); }
.callout.warn .val { font-weight: 600; }
.callout.warn .label { color: var(--alert-text); }
.meta { display: grid; gap: 3px; font: 500 17px/1.35 var(--font); color: var(--fg-2); }
.meta b { font-weight: 600; color: var(--fg); }
.tools { display: flex; gap: 12px; }
.tools .btn { flex: 1; font-size: 19px; }

/* ---------- buttons ---------- */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 64px; min-width: 64px; padding: 8px 14px; border-radius: 18px;
  background: var(--btn); color: var(--fg); box-shadow: inset 0 0 0 1px var(--btn-line);
  font: 600 20px/1.15 var(--font); text-align: center;
  transition: transform 0.08s ease-out, background-color 0.08s ease-out;
}
.btn:active { background: var(--btn-press); transform: scale(0.98); }
.btn .lines { display: grid; gap: 3px; min-width: 0; }
.btn small { display: block; font: 500 17px/1.2 var(--font); }
.btn.go { min-height: 76px; background: var(--go); color: var(--go-fg); box-shadow: none; font-size: 27px; font-weight: 700; letter-spacing: -0.01em; }
.btn.go:active { background: var(--go-press); }
.btn.go small { font-weight: 600; }
.btn.big { min-height: 76px; font-size: 22px; font-weight: 700; }
.btn.fill { background: var(--fill); box-shadow: none; }
.btn.fill:active { background: var(--fill-press); }
.btn.danger { background: var(--alert); color: var(--alert-fg); box-shadow: none; }
.btn.on { background: var(--fg); color: var(--bg); box-shadow: none; }
.btn[disabled] { opacity: 0.36; cursor: default; }
.btn[disabled]:active { transform: none; background: var(--btn); }
.btn.block { width: 100%; }

/* ---------- action bar ---------- */
.actions { flex: none; background: var(--bg); border-top: 1px solid var(--line); }
.actions-in { display: grid; gap: 12px; padding-block: 10px 8px; }
.row { display: flex; gap: 12px; align-items: stretch; }
.row > .btn { flex: 1 1 0; min-width: 0; }
.row > .btn.back { flex: 0 0 24%; min-width: 78px; }
.row > .btn.side { flex: 0 0 26%; min-width: 84px; font-size: 19px; }
.row > .btn.main { flex: 3 1 0; }
.row > .btn.half { flex: 2 1 0; }
.btn.go.ans { font-size: 23px; }
.timerbox {
  flex: 3 1 0; min-width: 0; min-height: 76px; border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  background: var(--time-solid); color: var(--time-on);
  font: 700 clamp(38px, 12vw, 50px)/1 var(--font-round); font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
}

/* ---------- tab bar ---------- */
.tabs { flex: none; background: var(--bar); border-top: 1px solid var(--line); }
.tabs-in { display: flex; gap: 12px; padding-block: 4px 2px; }
.tab {
  flex: 1 1 0; min-width: 0; min-height: 64px; border-radius: 16px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  color: var(--fg-2); font: 600 17px/1.15 var(--font);
}
.tab[aria-current="page"] { color: var(--fg); background: var(--fill); font-weight: 700; }
.tab:active { background: var(--fill-press); }

/* ---------- big cards on the Now tab ---------- */
.hero { display: grid; gap: 16px; padding-top: 6px; }
.hero .count { font: 700 clamp(56px, 17vw, 88px)/1 var(--font-round); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; color: var(--time-text); }
.hero .lead { font-size: clamp(21px, 5.65vw, 23px); line-height: 1.38; }
.hero .lead b { font-weight: 700; }

/* ---------- tick rows ---------- */
.ticks { display: grid; gap: 12px; }
.tick {
  display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px;
  padding: 10px 14px; border-radius: 16px; background: var(--btn);
  font: 500 20px/1.25 var(--font);
}
.tick:active { background: var(--btn-press); }
.tick .box {

    /* ---------------------------------------------------------------- glossary */
    glossary: {
      'dice': { term: 'Dice', text: 'Cut into small cubes.\nSlice into strips, then cut across the strips.\n¼ inch is about the size of a pea.' },
      'mince': { term: 'Mince', text: 'Chop as small as you can.\nRock the knife back and forth over the pile until the pieces are tiny.' },
      'chop': { term: 'Roughly chop', text: 'A few quick cuts.\nUneven pieces about the size of your fingernail are fine.' },
      'half-moons': { term: 'Half-moons', text: 'Cut the onion in half from top to bottom.\nLay each half flat side down.\nSlice across it. Each slice falls apart into half-circles.' },
      'zest': { term: 'Zest', text: 'The thin green outer skin of the lime. It holds the lime smell.\nScrape it off with a fine grater. Or peel thin strips with a vegetable peeler and chop them tiny.\nStop when you reach the white layer. The white part is bitter.' },
      'simmer': { term: 'Simmer', text: 'Just below boiling.\nA few small bubbles break the surface every second or two.\nIf it is bubbling hard, turn the heat down.' },
      'boil': { term: 'Full boil', text: 'Big bubbles all over the surface that do not stop when you stir.' },
      'heat': { term: 'Heat levels', text: 'On a dial marked 1 to 10:\nLow is 2.\nMedium-low is 3 to 4.\nMedium is 5.\nMedium-high is 7.\nHigh is 9 to 10.\nOther numbers on the dial? Medium is the middle number.\nOnly Lo, Med and Hi? Medium-low is halfway between Lo and Med. Medium-high is halfway between Med and Hi.\nGas with no marks? Look at the flame. Low is the smallest steady flame. High is the biggest flame that stays under the pan. Medium is halfway between.\nIf the food bubbles or browns too fast, turn the burner down.' },
      'lid-ajar': { term: 'Lid slightly open', text: 'Put the lid on, then slide it a little to one side.\nLeave a gap about as wide as a finger so steam can escape.' },
      'blanch': { term: 'Blanch', text: 'Dunk food in very hot water for a short time, then drain it.\nHere it takes the harsh bite off the raw onion and helps it turn pink.' },
      'toast': { term: 'Toast a spice', text: 'Heat a dry pan with no oil.\nAdd the spice and keep it moving until you can smell it, about 30 seconds.\nSpoon it out right away. It burns fast.' },
      'char': { term: 'Char', text: 'Burn the skin on purpose until it is black and blistered.\nThe skin gets peeled off. The flesh underneath turns soft and smoky.' },
      'seed': { term: 'Seed a chile', text: 'Cut off the stem. Slice the chile in half the long way.\nScrape out the seeds and the pale ribs with the tip of a spoon.\nThat is where most of the heat is.\nWash your hands with soap after. Do not touch your eyes.' },
      'bacon-fat': { term: 'Bacon fat', text: 'The melted fat left in the pan after frying bacon.\nIt is the cooking oil for the next step.' },
      'golden': { term: 'Deep golden', text: 'Past soft and see-through.\nThe onion is brown at the edges, the color of honey.' },
      'cook-dry': { term: 'Cook until dry', text: 'Keep cooking and stirring until the watery liquid is gone.\nTest: drag the spoon across the pan. If no liquid runs back into the path, it is done.' },
      'puree': { term: 'Purée', text: 'Blend until completely smooth, with no chunks.' },
      'cure': { term: 'Cure', text: 'Lime juice firms up raw fish and turns it white, the way cooking does.\nIt does not kill germs or parasites. That is why the fish must be very fresh and stay cold.' },
      'opaque': { term: 'Opaque', text: 'Solid white all the way through.\nNo shiny, see-through center.' },
      'float': { term: 'Float freely', text: 'There is enough juice that the pieces move around when you stir.\nIf the fish is packed tight, the juice cannot reach every side.' },
      'fold': { term: 'Fold', text: 'Mix gently so nothing gets mashed.\nSlide a spoon down the side of the bowl, under, and up over the top.\nTurn the bowl and repeat.' },
      'fluff': { term: 'Fluff', text: 'Drag a fork through the rice to separate the grains.\nDo not stir or press. That makes it mushy.' },
      'shimmer': { term: 'Shimmering oil', text: 'Hot oil looks thin and shiny. Faint ripples move across it.\nYou may see the first thin wisp of smoke.\nThat is the moment to add the food.\nDo not tilt the pan to check. The handle is very hot.' },
      'tent': { term: 'Tent with foil', text: 'Lay a sheet of foil loosely over the top.\nIt holds the heat in.' },
      'pat-dry': { term: 'Pat dry', text: 'Press paper towels onto the food to soak up the water on its surface.\nDry food browns. Wet food steams.' },
      'c-shape': { term: 'Loose C', text: 'A cooked shrimp curls into the letter C.\nIf it curls tight into an O, it is overcooked.' },
      'wedges': { term: 'Wedges', text: 'Cut the lime in half from tip to tip.\nCut each half the long way into 3 pieces.' },
      'scallions': { term: 'Scallions', text: 'Also called green onions.\nCut off the hairy root end.\nUse both the white and the green parts.' },
      'avocado': { term: 'Open an avocado', text: 'Lay the avocado on the cutting board. Do not hold it in your hand.\nCut into it the long way until the knife hits the pit.\nRoll the avocado so the cut goes all the way around the pit.\nTwist the two halves apart.\nNeed the half with the pit? Scoop the pit out with a spoon.' },
      'slit': { term: 'Slit', text: 'One shallow cut down the side of the chile, from stem to tip.\nThe chile stays whole but lets its flavor out.' },
      'milky': { term: 'Milky white', text: 'Raw rice grains look a little see-through.\nAfter a few minutes in hot oil they turn solid, chalky white.' },
      'damp-towel': { term: 'Damp towel', text: 'Wet a clean kitchen towel and wring it out hard.\nIt should feel damp, not dripping.' },
      'coldest': { term: 'Coldest spot', text: 'The bottom shelf of the fridge, at the back.' },
      'broiler': { term: 'Broiler', text: 'The heating element at the top of the oven. It cooks from above with very high heat.\nSet the oven to Broil, High.\nThe food goes on a rack near the top.\nIn some gas ovens the broiler is a drawer under the oven instead.' },
      'shred': { term: 'Shred cabbage', text: 'Cut the cabbage into wedges through the core.\nCut the hard core off a wedge.\nLay the wedge flat and slice across it as thin as you can.\nThe slices fall into ribbons.' },
      'shuck': { term: 'Husk corn', text: 'Peel the green leaves down and snap them off at the bottom.\nPull off the silky threads.' },
      'crumble': { term: 'Crumble', text: 'Break it into small bits with your fingers.' },
      'spoons': { term: 'Measuring spoons', text: 'Use the set of measuring spoons, not the spoons you eat with.\nEach one is stamped with its size.\nTBSP or 15 mL is the tablespoon. It is the biggest.\nTSP or 5 mL is the teaspoon.\nThe smaller ones say ½ and ¼.\nFill the spoon. Scrape it level with the back of a knife.\n1½ teaspoons means one 1 teaspoon plus one ½ teaspoon.\n3 teaspoons make 1 tablespoon. 4 tablespoons make ¼ cup.' },
      'pinch': { term: 'Pinch', text: 'What you can pick up between your thumb and two fingers.' },
      'strainer': { term: 'Strainer', text: 'A bowl full of holes, also called a colander.\nSet it in the sink. Liquid runs through. The food stays.' },
      'clove': { term: 'Garlic clove', text: 'A whole garlic is called a head. Do not use the whole head.\nBreak off one segment. That is a clove.\nPress down on it with the bottom of a mug until it cracks.\nPeel off the papery skin. Cut off the hard end.' },
      'cilantro': { term: 'Cilantro or parsley?', text: 'You have 2 bunches of cilantro and 1 bunch of parsley. They look alike.\nCilantro leaves are rounded and soft. Rub one. It smells sharp and strong.\nParsley leaves are pointed and darker. It smells mild.\nThe band or twist tie often names the herb.' },
      'knife': { term: 'Cutting safely', text: 'Put a damp paper towel under the cutting board so it cannot slide.\nCut anything round in half first. Lay the flat side down so it cannot roll.\nHold the food with your fingertips curled under. Your knuckles face the blade.\nCut slowly. Never try to catch a falling knife.' },
      'sear': { term: 'Sear', text: 'Cook fast in a very hot pan so the outside browns.\nLay the food down. Do not move it until it is time to turn it.' }
    },

/*
 * Ceviche Night engine: pure scheduling and state logic. No DOM. No clock of its own.
 * UMD: Node -> module.exports, browser -> window.Engine.
 *
 * Conventions
 *   plan   the PLAN object (SPEC section 2). Never mutated.
 *   state  the State object (SPEC 3.1). Never mutated. Reducers return a NEW object.
 *   now    epoch milliseconds. Every time-dependent function takes it. Nothing reads the real clock.
 *   step   a Step object from plan.steps. Every function that takes a step also accepts its id string.
 *   Loc    'home-am' | 'away' | 'home-pm' | 'drive' | 'hers'
 *   Nothing throws on unknown ids, missing optional fields, or empty collections.
 *
 * TIME
 *   dayMs(state) -> ms            local midnight of state.day (NaN when state.day is not a date)
 *   anchorMs(state, name) -> ms   wall-clock time of state.anchors[name] on the cook day (NaN when unknown)
 *
 * PLACES AND STATUS
 *   location(plan, state) -> Loc                  from which move steps are done
 *   opt(plan, state, name) -> value               state.opts[name] ?? plan.optionDefaults[name] (a stored null = not set)
 *   stepById(plan, id) -> Step | null
 *   isActive(plan, state, step) -> bool           its `when` matches and it is not skipped
 *   isDone(plan, state, step) -> bool             state.done[id] set, or a choice whose option was answered
 *   isAvailable(plan, state, step, now) -> bool   active, not done, deps met, wait over, right place, notBefore reached
 *   blockers(plan, state, step, now) -> [ {type:'after', stepId}
 *                                       | {type:'wait', waitId, endsAt}      endsAt null = timer not started yet
 *                                       | {type:'time', at}
 *                                       | {type:'place', where} ]            where = step.where; for a move step the Loc it needs
 *                                         Gates only. A done or inactive step returns [] too: test isDone / isActive first.
 *        The wait gate is SPEC 3.3 with one addition: a `must` step is never left waiting past a hard out. At his place
 *        (morning: leaveAm, pack-up stop: leavePm) its gate opens no later than (hard out - its own hands-on minutes),
 *        once the timer has been started. blockers().endsAt, isAvailable, pick and nextUnlock all use that moment;
 *        waitsView still shows the timer as it really runs.
 *   stepMins(step) -> minutes     hands-on length: mins + timer.secs/60          (Step object only, no id)
 *   needMins(step) -> minutes     stepMins + wait.mins when the wait is attended (used by the hard-out fit rule)
 *   canGiveUp(plan, state, step, now) -> bool     SPEC 9.2: a check step with a giveUp, he is in 'home-am', and now is
 *                                                 inside withinMinsOf (a giveUp without withinMinsOf: any time in 'home-am')
 *
 * WHAT TO DO NEXT
 *   pick(plan, state, now) -> Step | null         SPEC 3.4. A step whose urgent timer (started in this place) has ended
 *                                                 always comes first.
 *                                                 A move step is returned ONLY once its anchor time is reached,
 *                                                 and then only after every `must` step he can do right now.
 *                                                 (SPEC 3.4 step 2 puts the move first; a must step is "never dropped"
 *                                                 and nobody walks out past a ringing timer, so those two go before it.)
 *                                                 Before its anchor a move is never returned: null + an available move step
 *                                                 means "free time, he may leave early" (offer the move button yourself).
 *                                                 Fit rule at his place: a step that can wait (an 'either' step, an optional
 *                                                 step, a non-must pack-up step) is offered only if
 *                                                   - it ends before the hard out, stove time included (now + needMins), and
 *                                                   - its hands-on time leaves room for the work that will certainly be done
 *                                                     there before he goes: must steps, home-only steps that are not optional
 *                                                     (morning only), steps whose urgent timer is running there, and the step
 *                                                     an urgent timer of its own will call for. Only work that can still
 *                                                     start before the hard out counts. That work is done while the pot is
 *                                                     on, so it is not added to the stove time.
 *   nextStep(plan, state, now) -> stepId | null
 *   nextUnlock(plan, state, now) -> { at, stepId, reason:'wait'|'time'|'move' } | null
 *                                                 When several things unlock in the same millisecond, stepId is the one
 *                                                 pick() returns at that moment.
 *
 * REDUCERS  -> new State with rev+1 and updatedAt = now.
 *              When nothing changes (unknown id, refused value, already in that state) the SAME state object comes back.
 *              The same when `now` is not a finite number: a broken clock never reaches the saved state.
 *   initialState(plan, device, now) -> State      rev 0, updatedAt 0. day = today when local hour < 16, else tomorrow.
 *   setDay(plan, state, 'YYYY-MM-DD', now)
 *   complete(plan, state, stepId, now, payload?)  payload {value} for choice steps. Arms step.wait, runs rules,
 *                                                 leavePm auto-skips every not-done where:'home' step. Already done -> unchanged.
 *                                                 A move also completes every earlier move that is still open, at the same
 *                                                 time (their rules and the leavePm write-off run), in the one rev.
 *   uncomplete(plan, state, stepId, now)          removes done + the wait it armed (+ the answer of a choice step).
 *                                                 Not done (and not an answered choice) -> unchanged.
 *                                                 Options that plan.rules set for this step are taken back, unless another
 *                                                 done step's rule, a ticked Tonight item or an answered choice still gives
 *                                                 the same value. (A give-up or a Setup choice with that same value cannot be
 *                                                 told apart and is taken back too: for an exact undo use your own history.)
 *                                                 A move: the moves after it are taken back as well (he is in the place
 *                                                 before it again). The leavePm move: every where:'home' step is un-skipped,
 *                                                 also one he had skipped himself (the state cannot tell the two apart).
 *                                                 A where:'home' step taken back while he is on the road or in her kitchen
 *                                                 is marked skipped (it cannot be done any more and must not block dinner).
 *   skip(plan, state, stepId, now)
 *   retry(plan, state, stepId, now)               check step: restart its afterWait timer for check.retryMins
 *   giveUp(plan, state, stepId, now)              check step: apply check.giveUp.set to opts (already set -> unchanged)
 *   ackLap(plan, state, waitId, n, now)           laps 1..n are acknowledged (n omitted = one more)
 *   tick(plan, state, stepId, itemId, on, now)
 *   tickTonight(plan, state, id, on, now)         on applies that tonight item's `sets`; off takes them back (unless he
 *                                                 answered that question himself since), so the question is asked again
 *   setOpt(plan, state, name, value, now)         value undefined removes the override
 *   setAnchor(plan, state, name, minutes, now)    clamped 0..1439; refused when it would touch or cross a neighbour
 *   startFg(plan, state, stepId, endsAt, now)
 *   clearFg(plan, state, now)
 *
 * WAITS AND ALERTS
 *   waitsView(plan, state, now) -> [ { id, label, lapLabel, by, gatedStepId, startedAt, endsAt, remainingMs,
 *                                      elapsed, urgent, attended, laps:[{n, at, due, acked}], overMax, here } ]
 *        elapsed is a boolean. remainingMs >= 0. gatedStepId may be null. Sorted by endsAt.
 *        Lists every timer whose gated step is not done. A timer that gates nothing is listed until it ends.
 *        here = started in the place he is in now, i.e. after he left the place before it. After a move, timers from
 *        the place he left are dropped, except a not-attended one that is still running (e.g. onions steeping in a jar):
 *        listed with here:false. (Taking the arrival back and tapping it again does not change what is "here".)
 *   alerts(plan, state, now) -> [ { kind:'lap'|'wait'|'max'|'leave', id, title, stepId?, waitId?, lap?, lapOf?, minsLeft? } ]
 *        Order: laps, ended urgent waits, max exceeded, leave warning. `id` is stable while the alert lasts.
 *        Timer alerts only come from timers started in the place he is in now (nothing rings for a kitchen he left).
 *        lap    one per wait: the latest due, un-acked lap of a still-running wait. ackLap(waitId, alert.lap) clears it.
 *               stepId = the step that started the timer.
 *        wait   an urgent wait has ended and its step is not done. stepId = the step to do.
 *        max    wait.max minutes exceeded and its step is not done. stepId = the step to do.
 *        leave  the current place's hard-out move (leaveAm, leavePm) is within 10 min or past. minsLeft <= 0 = past.
 *               minsLeft is rounded down. stepId = the move step. Titles: 'Leave in 8 min' / 'Time to leave'.
 *
 * PROJECTION
 *   project(plan, state, now) -> {
 *     now,
 *     rows: [ {type:'step', stepId, start, end, status:'done'|'next'|'later', loc, deferred?:true, late?:true}
 *           | {type:'wait', waitId, label, start, end, loc}
 *           | {type:'free', start, end, loc, nextStepId}
 *           | {type:'move', stepId, at, loc, to, status} ],     loc = place being left, to = place entered
 *     byStep: { [stepId]: {start, end, status, loc, deferred} },  only steps that are done or scheduled
 *     dinnerAt,        start of step 'dinner' (null when it cannot be scheduled)
 *     dinnerAnchor, lateMin, spareMin,
 *     warnings: [ {code:'late'|'am-overrun'|'missed'|'deferred'|'beans-later', text, stepIds?} ]
 *   }
 *   The plan begins at `now`; at the start anchor instead while nothing is done yet, and on any day before the cook day
 *   (a step ticked off the evening before does not move the morning into the night).
 *   rows are chronological (done rows first). late:true = the step runs past its place's deadline
 *   (leaveAm at home in the morning, leavePm when packing, the dinner anchor in her kitchen).
 *   A step with no byStep entry is not going to happen today (optional and dropped, or listed under 'missed').
 *   Warnings, in this order: 'late' (dinner after its anchor), 'am-overrun' (stepIds: steps at his place that end after
 *   leaveAm, then home-only steps whose stove timer is still running when he is due to leave; when only the latter, the

  }
  function renderTimeline(v) {
    var W = R.tlin.clientWidth || 700, hiId = v.shown ? v.shown.id : '', n = R.right.clientWidth >= 760 ? 4 : 3;
    if (v.proj !== tl.proj) { tl.proj = v.proj; tl.n++; }
    var key = tl.n + '|' + W + '|' + hiId + '|' + n;
    if (key !== tl.key) {                                         // only after a change, or when the app re-plans (every 15 s at most)
      tl.key = key;
      var built = buildTimeline(v, W, hiId);
      tl.xOf = built ? built.xOf : null; tl.lo = built ? built.lo : 0; tl.hi = built ? built.hi : 0;
      if (setHTML(R.plot, built ? built.html : '')) place(R.plot);
      var up = upHTML(v, n);
      show(R.uplabel, up); show(R.up, up); setHTML(R.up, up);
    }
    var x = tl.xOf && v.now >= tl.lo && v.now <= tl.hi ? tl.xOf(v.now) : -1;
    show(R.now, x >= 0);
    if (x >= 0) {
      var s = x.toFixed(2) + '%';
      if (R.now.__x !== s) { R.now.style.left = s; R.now.__x = s; R.now.classList.toggle('is-flip', x > 88); }
    }
  }
  // the plan's warnings, kept to a line: a long list of steps becomes a count (the phone guide's Day tab names them)
  function warnText(w) {
    var t = String(w.text || ''), n = w.stepIds ? w.stepIds.length : 0, i = t.indexOf(': ');
    return n > 2 && i > 0 ? t.slice(0, i) + ': ' + n + ' steps.' : t;
  }
  function renderRight(v) {
    setHTML(R.head, headHTML(v));
    var warns = (v.proj.warnings || []).filter(function (w) { return w.code !== 'late' && w.text; }).slice(0, 2);
    show(R.warns, warns.length);
    setHTML(R.warns, warns.map(function (w) { return '<li>' + esc(warnText(w)) + '</li>'; }).join(''));
    renderTimeline(v);
  }

  /* ================================================================== the loop */

  function tickText(now) {
    var nodes = root.querySelectorAll('[data-bd-until]'), i, n, rem, txt;
    for (i = 0; i < nodes.length; i++) {
      n = nodes[i];
      rem = Number(n.getAttribute('data-bd-until')) - now;
      txt = rem > 0 ? (n.getAttribute('data-pre') || '') + countdown(rem) + (n.getAttribute('data-post') || '') : n.getAttribute('data-done');
      if (n.textContent !== txt) n.textContent = txt;
    }
  }
  function update() {
    if (!app || !root || !R) return;
    try {
      var v = view();
      renderLeft(v);
      renderRight(v);
      tickText(v.now);
      failed = false;
    } catch (e) { fail(e); }
  }
  function fail(e) {
    if (!failed && window.console && console.error) console.error('Board: ' + (e && e.message ? e.message : e));
    failed = true;
    try {
      setHTML(R.card, '<div class="bd-card"><h1 class="bd-title">The board hit a problem</h1><p class="bd-lead">Your progress is safe. Use the phone guide.</p></div>');
      show(R.actions, true);
      setHTML(R.actions, '<div class="bd-rowx"><a class="bd-btn is-go" href="#now">Open the phone guide</a></div>');
    } catch (e2) { /* nothing more to do */ }
  }

  /* ================================================================== taps */

  function openStep(id) {
    var st = ix.byId[id], f = currentFocus();
    if (!st) return;
    var state = app.getState();
    if (safe(function () { return app.engine.isDone(app.plan, state, st); }, false)) {
      ui.peek = id; ui.peekState = state; ui.peekFocus = f && ix.byId[f] ? f : null;        // look only: the phone's current step stays
    } else {
      ui.peek = null;
      if (id !== f) app.act('focus', id);
    }
    update();
  }
  // the timers that ring for the step on screen are answered by using its buttons
  function ackFor(stepId) {
    currentAlerts().forEach(function (a) {
      if (a.stepId === stepId && (a.kind === 'wait' || a.kind === 'max' || a.kind === 'fg') && !ui.acked[a.key]) {
        ui.acked[a.key] = true;
        app.act('ackAlert', a.key);
      }
    });
  }
  var HANDLERS = {
    'undo': function () { ui.peek = null; app.act('undo'); },
    'done': function (el, id) { app.act('complete', id); },
    'retry': function (el, id) { app.act('retry', id); },
    'giveup': function (el, id) { app.act('giveUp', id); },
    'skip': function (el, id) { app.act('skip', id); },
    'choose': function (el, id) {
      var st = ix.byId[id], o = st && st.choice ? (st.choice.options || [])[Number(el.getAttribute('data-i'))] : null;
      if (o) app.act('complete', id, { value: o.value });
    },
    'start': function (el, id) { app.act('startTimer', id); },
    'skiptimer': function () { app.act('skipTimer'); },
    'tick': function (el, id) { app.act('tick', id, el.getAttribute('data-item'), el.getAttribute('aria-pressed') !== 'true'); },
    'tonight': function (el) { app.act('tickTonight', el.getAttribute('data-id'), el.getAttribute('aria-pressed') !== 'true'); },
    'focus': function (el, id) { ui.peek = null; app.act('focus', id); },
    'bar': function (el, id) { openStep(id); },
    'unpeek': function () { ui.peek = null; },
    'undone': function (el, id) { ui.peek = null; app.act('uncomplete', id); },
    'term': function (el) {
      if (ui.gloss) return;
      ui.backTo = { id: R.card.__id, top: R.card.scrollTop };
      ui.gloss = el.getAttribute('data-key'); ui.glossFor = R.card.__id;
    },
    'gloss-close': function () { ui.gloss = null; },
    'more': function () { R.card.scrollTop += Math.round(R.card.clientHeight * 0.75); },
    'preview-exit': function () { app.act('previewExit'); },
    'alert': function (el) {
      var key = el.getAttribute('data-key'), a = currentAlerts().filter(function (x) { return x.key === key; })[0];
      if (!a) return;
      if (a.kind === 'lap') { app.act('ackLap', a.waitId, a.lap); return; }
      ui.acked[a.key] = true;
      app.act('ackAlert', a.key);
      ui.peek = null;
      if (a.stepId && ix.byId[a.stepId] && a.stepId !== currentFocus()) app.act('focus', a.stepId);
    }
  };
  // a tap between two thin bars picks the nearest one
  function nearestBar(rowEl, x) {
    var bars = rowEl.querySelectorAll('.bd-bar'), best = null, bestD = 18, i, r, d;
    for (i = 0; i < bars.length; i++) {
      r = bars[i].getBoundingClientRect();
      d = x < r.left ? r.left - x : x > r.right ? x - r.right : 0;
      if (d < bestD) { bestD = d; best = bars[i]; }
    }
    return best;
  }
  function onClick(ev) {
    if (!app || !root) return;
    var t = ev.target && ev.target.closest ? ev.target : null;
    if (!t) return;
    var el = t.closest('[data-b]');
    if (!el || !root.contains(el)) {
      var rowEl = t.closest('.bd-row');
      el = rowEl && root.contains(rowEl) ? nearestBar(rowEl, ev.clientX) : null;
    }
    if (!el || el.disabled) return;
    var fn = HANDLERS[el.getAttribute('data-b')];
    if (!fn) return;
    if (el.closest('.bd-actions')) {
      // a slippery double tap must not skip a step: the action bar ignores a second tap for half a second
      if (ev.timeStamp - ui.lastAction < api.guardMs) { ev.preventDefault(); return; }
      ui.lastAction = ev.timeStamp;
      var f = currentFocus();
      if (f && !ui.peek && !ui.gloss) ackFor(f);
    }
    fn(el, el.getAttribute('data-step'), ev);
    update();
  }
  function onEscape(ev) {                                       // on the document: after a re-render the keyboard focus is on the page itself
    if (app && root && ui && ui.gloss && ev.key === 'Escape') { ui.gloss = null; update(); }
  }
  function onKey(ev) {
    if (!app || !root) return;
    var t = ev.target;
    if ((ev.key === 'Enter' || ev.key === ' ') && t && t.getAttribute && t.getAttribute('role') === 'button' && root.contains(t)) {
      ev.preventDefault(); ev.stopPropagation();             // the phone guide listens for the same keys on the document
      t.click();
    }
  }
  function onResize() { if (tl) { tl.key = ''; update(); } }

  /* ================================================================== mount / unmount */

  var SKELETON =
    '<div class="bd">' +
      '<section class="bd-left" aria-label="What to do now">' +
        '<div class="bd-nav"><a class="bd-link" href="#now">' + ico('left', 22) + '<span>Phone guide</span></a><span class="bd-place" data-r="place"></span></div>' +
        '<div class="bd-alerts" data-r="alerts" role="status" aria-live="assertive" hidden></div>' +
        '<div class="bd-timers" data-r="timers" hidden></div>' +
        '<div class="bd-scrollwrap"><div class="bd-scroll" data-r="card"></div>' +
          '<div class="bd-more" data-r="more" hidden><button type="button" data-b="more">' + ico('down', 20) + '<span>More</span></button></div></div>' +
        '<div class="bd-actions" data-r="actions" hidden></div>' +
      '</section>' +
      '<section class="bd-right" data-r="right" aria-label="The day">' +
        '<header class="bd-head" data-r="head"></header>' +
        '<ul class="bd-warns" data-r="warns" hidden></ul>' +
        '<div class="bd-tl"><div class="bd-tlin" data-r="tlin"><div class="bd-plot" data-r="plot"></div><div class="bd-now" data-r="now" hidden><b>Now</b></div></div></div>' +
        '<div class="bd-upwrap"><div class="bd-uphead"><p class="bd-label" data-r="uplabel">Coming up</p>' +
          '<p class="bd-legend"><span><i class="bd-lg is-step"></i>a step</span><span><i class="bd-lg is-wait"></i>a timer running by itself</span><span><i class="bd-lg is-done"></i>done</span></p></div>' +
          '<div class="bd-up" data-r="up" hidden></div></div>' +
      '</section>' +
    '</div>';

  function mount(el, cookApp) {
    if (root) unmount();
    if (!el || !cookApp || !cookApp.plan || !cookApp.engine || typeof cookApp.getState !== 'function' || typeof cookApp.now !== 'function' ||
        typeof cookApp.act !== 'function' || typeof cookApp.subscribe !== 'function') {
      throw new Error('CookBoard.mount needs a root element and the CookApp contract');
    }
    try {
      app = cookApp; root = el;
      ix = indexPlan(app.plan);
      ui = { peek: null, peekState: null, peekFocus: null, gloss: null, glossFor: null, backTo: null, acked: {}, lastAction: -1e9 };
      tl = { proj: null, n: 0, key: '', xOf: null, lo: 0, hi: 0 };
      pc = { state: null, at: 0, p: null };
      failed = false;
      root.innerHTML = SKELETON;
      if (!ensureStyle()) throw new Error('The board styles could not be loaded');
      R = {};
      var nodes = root.querySelectorAll('[data-r]'), i;
      for (i = 0; i < nodes.length; i++) R[nodes[i].getAttribute('data-r')] = nodes[i];
      root.addEventListener('click', onClick);
      root.addEventListener('keydown', onKey);
      document.addEventListener('keydown', onEscape);
      R.card.addEventListener('scroll', updateMore, { passive: true });
      window.addEventListener('resize', onResize);
      unsub = app.subscribe(update);
      update();
    } catch (e) {
      unmount();
      throw e;
    }
  }
  function unmount() {
    if (typeof unsub === 'function') { try { unsub(); } catch (e) { /* ignore */ } }
    unsub = null;
    window.removeEventListener('resize', onResize);
    document.removeEventListener('keydown', onEscape);
    if (root) {
      root.removeEventListener('click', onClick);
      root.removeEventListener('keydown', onKey);
      root.innerHTML = '';
    }
    app = null; root = null; R = null; ix = null; ui = null; tl = null;
  }

  window.CookBoard = api;
})();

</script>
</body></html>
